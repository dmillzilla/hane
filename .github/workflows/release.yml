name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release VERSION="${RELEASE_TAG#v}"
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Keep the release out of /releases/latest until every asset is uploaded.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Hane $RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
